
<main class="dashboard">

  <h1>Room Monitoring</h1>

  <p>Current room occupancy overview</p>

  <div class="rooms">

    @for (room of rooms(); track room.id) {

      <div class="room-card"
           [class.occupied]="room.occupied"
           [class.vacant]="!room.occupied">

        <h2>{{ room.name }}</h2>

        @if (room.occupied) {
          <p>Occupied</p>
        } @else {
          <p>Vacant</p>
        }

      </div>

    } @empty {

      <p>Waiting for room data...</p>

    }

  </div>

</main>
